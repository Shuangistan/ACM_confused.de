<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Database · confused.de</title>
<style>
:root{
  --paper:#F6F8F8; --surface:#FFFFFF; --sunken:#F0F3F3;
  --ink:#14181A; --ink-soft:#4C5559; --ink-faint:#7B868A;
  --line:#E1E5E5; --line-strong:#C7CECE;
  --accent:#0E6A72; --accent-soft:#E2EFF0;
  --ok:#1C7A4E; --ok-soft:#E4F1EA;
  --wait:#A8660A; --wait-soft:#F7EDDC;
  --no:#9E2F24; --no-soft:#F7E6E4;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1213; --surface:#161B1C; --sunken:#121718;
  --ink:#E6EAEA; --ink-soft:#A4AEAF; --ink-faint:#7A8486;
  --line:#252C2D; --line-strong:#394243;
  --accent:#5FBCC4; --accent-soft:#16282A;
  --ok:#5FC28E; --ok-soft:#152419;
  --wait:#DDA254; --wait-soft:#261D10;
  --no:#E0837A; --no-soft:#2A1614;
}}
:root[data-theme="dark"]{
  --paper:#0E1213; --surface:#161B1C; --sunken:#121718;
  --ink:#E6EAEA; --ink-soft:#A4AEAF; --ink-faint:#7A8486;
  --line:#252C2D; --line-strong:#394243;
  --accent:#5FBCC4; --accent-soft:#16282A;
  --ok:#5FC28E; --ok-soft:#152419;
  --wait:#DDA254; --wait-soft:#261D10;
  --no:#E0837A; --no-soft:#2A1614;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh}

header.top{border-bottom:1px solid var(--line);background:var(--surface);
  padding:.85rem 1.4rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.5rem}
.logo svg{display:block;flex:none}
.logo .bl{fill:var(--line-strong);stroke:var(--surface);stroke-width:.85;
  stroke-linejoin:round}
.logo .bl.on{fill:var(--accent)}
.brand{font-family:var(--mono);font-size:1.02rem;font-weight:600;letter-spacing:-.01em}
.brand b{color:var(--accent);font-weight:600}
.where{font-family:var(--sans);font-size:.74rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);
  border-left:1px solid var(--line-strong);padding-left:.8rem}

main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:1.2rem 1.4rem 2rem}

/* ---- the figures ---- */
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:.8rem;margin-bottom:1.2rem}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:.85rem 1rem}
.fig .n{font-family:var(--mono);font-size:1.7rem;line-height:1.1;
  font-variant-numeric:tabular-nums}
.fig .k{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:.2rem}
.fig .sub{font-size:.74rem;color:var(--ink-faint);margin-top:.3rem}
.fig.headline{background:var(--accent-soft);border-color:var(--accent)}
.fig.headline .n{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;margin-bottom:1.2rem}
.card-head{padding:.7rem 1rem;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.card-head h2{margin:0;font-size:.72rem;font-weight:650;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint)}
.filters{margin-left:auto;display:flex;gap:.35rem}
.filters button{font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;
  padding:.24rem .6rem;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-soft)}
.filters button[aria-pressed=true]{border-color:var(--accent);
  background:var(--accent-soft);color:var(--accent)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font-size:.68rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);text-align:left;padding:.5rem 1rem;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem 1rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--sunken)}
td.rule{font-family:var(--mono);font-size:.8rem;line-height:1.5;
  max-width:560px;word-break:break-word}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:.14rem .45rem;border-radius:999px;
  border:1px solid currentColor;white-space:nowrap}
.s-approved{color:var(--ok);background:var(--ok-soft)}
.s-proposed{color:var(--wait);background:var(--wait-soft)}
.s-rejected,.s-retired{color:var(--no);background:var(--no-soft)}
.who{font-size:.76rem;color:var(--ink-faint)}
.key{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint)}

/* Review controls. This is the offline path: an expert working through the
   base away from a live conversation, where there is time to read a clause
   properly rather than while someone waits. */
.acts{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-top:.8rem}
.acts input[type=text]{flex:1;min-width:140px;font:inherit;font-size:.8rem;
  padding:.32rem .5rem;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink)}
.acts button{font:inherit;font-size:.78rem;font-weight:650;cursor:pointer;
  padding:.32rem .7rem;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-soft)}
.acts button.yes{border-color:var(--ok);color:var(--ok)}
.acts button.yes:hover{background:var(--ok);color:var(--surface)}
.acts button.no{border-color:var(--no);color:var(--no)}
.acts button.no:hover{background:var(--no);color:var(--surface)}
.acts button.warn{border-color:var(--wait);color:var(--wait)}
.acts button.warn:hover{background:var(--wait);color:var(--surface)}
.governs{font-size:.74rem;color:var(--ink-faint);margin-top:.5rem;font-style:italic}
.impact{margin-top:.7rem;padding:.6rem .7rem;border-radius:7px;
  background:var(--wait-soft);border:1px solid var(--wait);font-size:.8rem}
.impact strong{display:block;color:var(--wait);font-size:.72rem;
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:.3rem}
.tally{font-family:var(--mono);font-size:.74rem;color:var(--ink-faint)}
/* A merge fires on strictly more cases than the rules it replaces, so the
   caution is shown above the numbers, not beneath them: "0 conflicts" over a
   handful of cases reads as safety unless something says otherwise first. */
.gen{border-bottom:1px solid var(--line);padding:.9rem 1rem}
.gen:last-child{border-bottom:0}
.gen pre{font-family:var(--mono);font-size:.82rem;line-height:1.5;margin:0 0 .5rem;
  background:var(--sunken);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:6px;padding:.55rem .65rem;overflow-x:auto}
.gen .replaces{font-size:.76rem;color:var(--ink-faint);margin-bottom:.5rem}
.gen .replaces code{font-family:var(--mono);font-size:.94em;display:block;
  margin-left:.8rem;color:var(--ink-soft)}
.gen .caution{display:block;font-size:.8rem;padding:.45rem .6rem;border-radius:6px;
  margin-bottom:.55rem;background:var(--wait-soft);border:1px solid var(--wait);
  color:var(--ink)}
.gen .caution.bad{background:var(--no-soft);border-color:var(--no)}
.gen .caution.ok{background:var(--ok-soft);border-color:var(--ok)}
.gen .nums{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);
  margin-bottom:.5rem}
/* What abstraction tried and could not keep. Without it, a case the agent
   failed to learn from looks identical to one it never attempted — which is
   the question people actually ask of this page. */
.drafted{margin-top:.35rem;font-size:.74rem;color:var(--ink-faint)}
.drafted code{font-family:var(--mono);font-size:.95em;color:var(--ink-soft)}
.drafted .why{color:var(--no)}
.tally b.bad{color:var(--no)}

/* Reset. Set apart from everything else and coloured for what it is: the
   only control on this page that destroys rather than records. */
.danger{
  margin-left:auto; font:inherit; font-size:.76rem; font-weight:650;
  padding:.3rem .7rem; border-radius:6px; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--surface);
  color:var(--ink-faint);
}
.danger:hover{border-color:var(--no); color:var(--no)}
.danger[data-armed="1"]{border-color:var(--no); background:var(--no);
  color:var(--surface)}

.empty{padding:2.4rem 1rem;text-align:center;color:var(--ink-faint);font-size:.9rem}
.empty strong{display:block;color:var(--ink);font-family:var(--serif);
  font-size:1.2rem;font-weight:400;margin-bottom:.4rem}

/* ---- detail drawer ---- */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;
  align-items:stretch;justify-content:flex-end;z-index:20}
.drawer.open{display:flex}
.drawer-inner{width:min(560px,100%);background:var(--surface);
  border-left:1px solid var(--line);overflow-y:auto;padding:1.2rem 1.3rem}
.drawer h3{font-family:var(--serif);font-weight:400;font-size:1.3rem;
  margin:.3rem 0 .2rem}
.drawer pre{font-family:var(--mono);font-size:.8rem;line-height:1.55;
  background:var(--sunken);border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:.8rem .9rem;overflow-x:auto;margin:.8rem 0}
.drawer h4{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin:1.3rem 0 .5rem}
.drawer .close{float:right;font:inherit;font-size:.78rem;cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
  border-radius:6px;padding:.25rem .6rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.82rem}
.kv dt{color:var(--ink-faint)}
.kv dd{margin:0;font-family:var(--mono);font-size:.78rem}

footer.site{border-top:1px solid var(--line);background:var(--surface)}
.site-inner{max-width:1240px;margin:0 auto;padding:1.05rem 1.4rem;display:flex;
  align-items:center;gap:.55rem;flex-wrap:wrap;font-size:.76rem;color:var(--ink-faint)}
.site-inner .name{font-family:var(--mono);color:var(--ink-soft)}
.site-inner .dot{color:var(--line-strong)}
</style>
</head>
<body>

<header class="top">
  <span class="logo">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
      <path class="bl on" d="M12.00 1.60 A10.4 10.4 0 0 1 21.01 6.80 L14.38 9.55 L10.62 8.45 Z"/>
      <path class="bl" d="M21.01 6.80 A10.4 10.4 0 0 1 21.01 17.20 L15.70 12.85 L14.38 9.55 Z"/>
      <path class="bl" d="M21.01 17.20 A10.4 10.4 0 0 1 12.00 22.40 L13.78 15.62 L15.70 12.85 Z"/>
      <path class="bl" d="M12.00 22.40 A10.4 10.4 0 0 1 2.99 17.20 L9.62 14.45 L13.78 15.62 Z"/>
      <path class="bl" d="M2.99 17.20 A10.4 10.4 0 0 1 2.99 6.80 L8.30 11.15 L9.62 14.45 Z"/>
      <path class="bl" d="M2.99 6.80 A10.4 10.4 0 0 1 12.00 1.60 L10.22 8.38 L8.30 11.15 Z"/>
    </svg>
    <span class="brand"><b>confused</b>.de</span>
  </span>
  <span class="where">Logic database</span>
  <button class="danger" type="button" id="reset">Reset database</button>
</header>

<main>
  <div class="figures" id="figures"></div>

  <section class="card">
    <div class="card-head">
      <h2>Rules</h2>
      <span class="filters" id="filters">
        <button type="button" data-status="" aria-pressed="true">All</button>
        <button type="button" data-status="approved" aria-pressed="false">Approved</button>
        <button type="button" data-status="proposed" aria-pressed="false">Awaiting review</button>
        <button type="button" data-status="rejected" aria-pressed="false">Rejected</button>
      </span>
    </div>
    <div id="rules"></div>
  </section>

  <section class="card" id="gen-card" hidden>
    <div class="card-head"><h2>Rules that could be merged</h2></div>
    <div id="gen"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Cases</h2></div>
    <div id="cases"></div>
  </section>
</main>

<footer class="site">
  <div class="site-inner">
    <span class="name">confused.de</span>
    <span class="dot">·</span>
    <span>ACM Europe School on Responsible AI</span>
  </div>
</footer>

<div class="drawer" id="drawer"><div class="drawer-inner" id="drawer-inner"></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FILTER = '';

async function get(path){
  const res = await fetch(path);
  if (!res.ok) throw new Error(path + ' -> ' + res.status);
  return res.json();
}

/* Where a decision stands. `waiting` is the one that matters: without it a
   parked inquiry is indistinguishable from an answered one, and nobody can see
   that somebody is waiting on a person. */
const STATE_PILL = {
  waiting:  ['proposed', 'waiting for a person'],
  settled:  ['approved', 'settled'],
  approved: ['approved', 'released by expert'],
  rejected: ['rejected', 'refused by expert'],
  audited_ok:    ['approved', 'audited, correct'],
  audited_wrong: ['rejected', 'audited, wrong'],
};
/* Three distinct outcomes that used to look the same from here: logic was
   learned, logic was attempted and refused, or nothing was attempted. */
function draftNote(c){
  const d = c.drafts || {};
  const kept = d.kept || [], bad = d.rejected || [];
  if (!kept.length && !bad.length){
    return c.facts.length
      ? (c.covered ? '' : '<div class="drafted">no logic drafted</div>')
      : '<div class="drafted">no facts could be drawn from this</div>';
  }
  let out = '<div class="drafted">';
  if (kept.length) out += `${kept.length} rule(s) drafted and queued`;
  if (bad.length){
    out += (kept.length ? '; ' : '') + `${bad.length} refused`;
    out += bad.slice(0, 2).map(r =>
      `<div><code>${esc((r.text||'').slice(0,72))}</code>`
      + `<span class="why"> — ${esc(r.why || '')}</span></div>`).join('');
  }
  return out + '</div>';
}

function stateCell(c){
  const [cls, label] = STATE_PILL[c.status] || ['proposed', c.status || '—'];
  return `<span class="pill s-${cls}">${esc(label)}</span>`;
}

function empty(title, body){
  return '<div class="empty"><strong>' + title + '</strong>' + body + '</div>';
}

/* ---------------------------------------------------------------------------
   Coverage is the headline, not the rule count. A large rule base that decides
   nothing is a worse position than a small one that decides most cases, and
   showing the counts first would invite the opposite conclusion.
--------------------------------------------------------------------------- */
async function loadFigures(){
  const s = await get('/api/db/stats');
  const pct = (s.coverage * 100).toFixed(0);
  const byRules = s.cases.rules || 0, byModel = s.cases.model || 0;
  const uncovered = s.cases.uncovered || 0;
  $('figures').innerHTML = `
    <div class="fig headline">
      <div class="n">${s.cases_total ? pct + '%' : '—'}</div>
      <div class="k">Decided by rules</div>
      <div class="sub">${byRules} of ${s.cases_total} cases, deterministically</div>
    </div>
    <div class="fig">
      <div class="n">${s.rules.approved || 0}</div>
      <div class="k">Approved rules</div>
      <div class="sub">${s.rules_total} in the database</div>
    </div>
    <div class="fig">
      <div class="n">${s.rules.proposed || 0}</div>
      <div class="k">Awaiting review</div>
      <div class="sub">${(s.rules.rejected || 0)} rejected to date</div>
    </div>
    <div class="fig">
      <div class="n">${byModel + uncovered}</div>
      <div class="k">Fell back to the model</div>
      <div class="sub">${uncovered} had no applicable logic</div>
    </div>`;
}

async function loadRules(){
  const {rules} = await get('/api/db/rules' + (FILTER ? '?status=' + FILTER : ''));
  if (!rules.length){
    $('rules').innerHTML = empty('No rules yet',
      FILTER ? 'Nothing with this status.'
             : 'Rules appear here when the agent proposes them from a case the '
             + 'database could not already answer.');
    return;
  }
  $('rules').innerHTML = '<div class="scroll"><table><thead><tr>' +
    '<th>Rule</th><th>Concludes</th><th>Status</th><th>Approved by</th>' +
    '<th class="num">Uses</th><th class="num">Audits</th></tr></thead><tbody>' +
    rules.map(r => `<tr class="clickable" data-key="${esc(r.canonical_key)}">
      <td class="rule">${esc(r.text)}<div class="key">${esc(r.canonical_key)}</div></td>
      <td><code>${esc(r.head)}</code></td>
      <td><span class="pill s-${esc(r.status)}">${esc(r.status)}</span></td>
      <td class="who">${esc(r.approved_by || '—')}</td>
      <td class="num">${r.uses}</td>
      <td class="num tally">${(r.audit_right || r.audit_wrong)
          ? `${r.audit_right}/${r.audit_right + r.audit_wrong}` +
            (r.audit_wrong ? ' <b class="bad">&#9679;</b>' : '')
          : '—'}</td></tr>`).join('') +
    '</tbody></table></div>';
  for (const tr of $('rules').querySelectorAll('tr.clickable'))
    tr.addEventListener('click', () => openRule(tr.dataset.key));
}

async function loadGeneralisations(){
  let cands = [];
  try { cands = (await get('/api/db/generalisations')).candidates; }
  catch { cands = []; }
  $('gen-card').hidden = cands.length === 0;
  if (!cands.length) return;
  $('gen').innerHTML = cands.map(c => {
    const cls = c.conflicts ? 'bad' : (c.reach >= 0.5 || c.evidence < 10 ? '' : 'ok');
    return `<div class="gen" data-text="${esc(c.text)}"
                 data-sources="${esc(c.sources.join(','))}">
      <span class="caution ${cls}">${esc(c.caution)}</span>
      <pre>${esc(c.text)}</pre>
      <div class="replaces">would replace, and retire:
        ${c.source_texts.map(t => `<code>${esc(t)}</code>`).join('')}</div>
      <div class="nums">keeps ${c.keeps} decision(s) · newly decides ${c.gains}
        · conflicts ${c.conflicts} of ${c.evidence} replayed · ${esc(c.how)}</div>
      ${c.conflict_cases.length ? '<div class="replaces">conflicts on: '
        + c.conflict_cases.map(x => esc(x.question).slice(0,70)).join('; ') + '</div>' : ''}
      <div class="acts">
        <input type="text" class="note" placeholder="Reason (recommended)">
        <button class="yes" data-act="merge">Approve merge</button>
      </div>
    </div>`;
  }).join('');
  for (const el of $('gen').querySelectorAll('.gen')){
    el.querySelector('button').addEventListener('click', async () => {
      const actor = prompt('Your name, for the record:', 'expert');
      if (!actor) return;
      const btn = el.querySelector('button'); btn.disabled = true;
      try {
        const res = await fetch('/api/db/generalisations', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({text: el.dataset.text,
            sources: el.dataset.sources.split(',').filter(Boolean),
            actor, note: el.querySelector('.note').value.trim()})});
        if (!res.ok) throw new Error('server returned ' + res.status);
        const out = await res.json();
        await refresh();
        alert(`Merged. ${out.retired.length} rule(s) retired; decisions they `
              + `already made stand.`);
      } catch (err){ btn.disabled = false; alert('Could not merge: ' + err.message); }
    });
  }
}

async function loadCases(){
  const {cases} = await get('/api/db/cases');
  if (!cases.length){
    $('cases').innerHTML = empty('No cases yet',
      'Every question put to the console is recorded here with the facts it '
      + 'produced. The record is what future generalizations are tested against.');
    return;
  }
  $('cases').innerHTML = '<div class="scroll"><table><thead><tr>' +
    '<th>When</th><th>Question</th><th>Concluded</th><th>Decided by</th>' +
    '<th>State</th><th class="num">Facts</th></tr></thead><tbody>' +
    cases.map(c => `<tr>
      <td class="who">${esc(c.created_at.replace('T',' ').replace('+00:00',''))}</td>
      <td>${esc(c.question || '—')}${draftNote(c)}</td>
      <td class="rule">${c.conclusions.length
          ? c.conclusions.map(esc).join('<br>') : '<span class="who">nothing derived</span>'}</td>
      <td><span class="pill s-${c.decided_by === 'rules' ? 'approved' : 'proposed'}">${esc(c.decided_by)}</span></td>
      <td>${stateCell(c)}</td>
      <td class="num">${c.facts.length}</td></tr>`).join('') +
    '</tbody></table></div>';
}

async function openRule(key){
  const d = await get('/api/db/rules/' + encodeURIComponent(key));
  const r = d.rule;
  $('drawer-inner').innerHTML = `
    <button class="close" type="button" id="close">Close</button>
    <h3>${esc(r.head)}</h3>
    <pre>${esc(r.text)}</pre>
    <dl class="kv">
      <dt>status</dt><dd>${esc(r.status)}</dd>
      <dt>identity</dt><dd>${esc(r.canonical_key)}</dd>
      <dt>origin</dt><dd>${esc(r.origin)}</dd>
      <dt>proposed by</dt><dd>${esc(r.proposed_by)} · ${esc(r.proposed_at)}</dd>
      <dt>approved by</dt><dd>${esc(r.approved_by || '—')} ${r.approved_at ? '· ' + esc(r.approved_at) : ''}</dd>
      <dt>uses</dt><dd>${r.uses}</dd>
    </dl>
    <h4>Cases it fired on (${d.cases.length})</h4>
    ${d.cases.length
      ? '<div class="scroll"><table><tbody>' + d.cases.slice(0, 40).map(c =>
          `<tr><td class="who">${esc(c.created_at.replace('T',' ').replace('+00:00',''))}</td>
               <td>${esc(c.question || '—')}${draftNote(c)}</td></tr>`).join('') + '</tbody></table></div>'
      : '<p class="who">None yet.</p>'}
    ${r.status === 'proposed' ? `
      <div class="acts">
        <input type="text" class="note" placeholder="Note (optional)">
        <button class="yes" data-act="approve">Approve rule</button>
        <button class="no"  data-act="reject">Reject</button>
      </div>
      <div class="governs">Approving governs every future case it matches —
        those will not come back to a person.</div>` : ''}
    ${r.status === 'approved' ? `
      <div class="acts">
        <input type="text" class="note" placeholder="Reason (recommended)">
        <button class="warn" data-act="retire">Retire this rule</button>
      </div>
      <div class="governs">It has already decided ${d.cases.length} case(s).
        Retiring stops it deciding more; it does not reverse those.</div>` : ''}

    <h4>History</h4>
    <div class="scroll"><table><tbody>${d.events.map(e =>
      `<tr><td class="who">${esc(e.at.replace('T',' ').replace('+00:00',''))}</td>
           <td><span class="pill s-${esc(e.event)}">${esc(e.event)}</span></td>
           <td class="who">${esc(e.actor)} ${esc(e.detail)}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('drawer').classList.add('open');
  $('close').addEventListener('click', () => $('drawer').classList.remove('open'));

  for (const btn of $('drawer-inner').querySelectorAll('.acts button')){
    btn.addEventListener('click', async () => {
      const note = $('drawer-inner').querySelector('.note').value.trim();
      const actor = prompt('Your name, for the record:', 'expert');
      if (!actor) return;
      const act = btn.dataset.act;
      const url = act === 'retire'
        ? `/api/expert/rule/${encodeURIComponent(key)}/retire`
        : `/api/expert/rule/${encodeURIComponent(key)}`;
      const body = act === 'retire'
        ? {actor, note}
        : {status: act === 'approve' ? 'approved' : 'rejected', actor, note};
      btn.disabled = true;
      try {
        const res = await fetch(url, {method:'POST',
          headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        if (!res.ok) throw new Error('server returned ' + res.status);
        const out = await res.json();
        if (act === 'retire' && out.cases_affected !== undefined){
          alert(`Retired. It had already decided ${out.cases_affected} case(s); `
                + `those stand and are listed against the rule.`);
        }
        await refresh();
        await openRule(key);
      } catch (err){ btn.disabled = false; alert('Could not record that: ' + err.message); }
    });
  }
}

$('drawer').addEventListener('click', e => {
  if (e.target === $('drawer')) $('drawer').classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('drawer').classList.remove('open');
});
for (const b of $('filters').querySelectorAll('button')){
  b.addEventListener('click', () => {
    FILTER = b.dataset.status;
    for (const o of $('filters').querySelectorAll('button'))
      o.setAttribute('aria-pressed', String(o === b));
    loadRules();
  });
}

async function refresh(){
  try { await Promise.all([loadFigures(), loadRules(),
                           loadGeneralisations(), loadCases()]); }
  catch (err){
    $('figures').innerHTML = empty('Server unreachable', esc(err.message));
  }
}
/* Two deliberate steps, and the second names what is about to be lost. A
   generic "are you sure?" is answered yes by reflex; a count is read. */
$('reset').addEventListener('click', async () => {
  const btn = $('reset');
  if (btn.dataset.armed !== '1'){
    const s = await get('/api/db/stats').catch(() => null);
    const rules = s ? s.rules_total : '?';
    const cases = s ? s.cases_total : '?';
    btn.dataset.armed = '1';
    btn.textContent = `Delete ${rules} rules and ${cases} decisions — click to confirm`;
    setTimeout(() => {
      if (btn.dataset.armed === '1'){
        btn.dataset.armed = '0'; btn.textContent = 'Reset database';
      }
    }, 6000);
    return;
  }
  btn.dataset.armed = '0';
  btn.disabled = true;
  btn.textContent = 'Resetting…';
  try {
    const res = await fetch('/api/db/reset', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({confirm: true})});
    if (!res.ok) throw new Error('server returned ' + res.status);
    const out = await res.json();
    await refresh();
    alert(`Removed ${out.removed.rules} rules, ${out.removed.cases} decisions `
          + `and ${out.removed.events} history entries. The case log is gone `
          + `too — future generalisations have nothing left to be tested `
          + `against.`);
  } catch (err){ alert('Could not reset: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = 'Reset database'; }
});

refresh();

/* The console runs in another tab, so this page goes stale the moment someone
   asks a question. Poll while it is visible, and catch up immediately when it
   is brought back to the front — the common case is a person switching to this
   tab precisely because they just did something in the other one. */
let timer = null;
function watch(){
  clearInterval(timer);
  if (document.visibilityState === 'visible'){
    refresh();
    timer = setInterval(refresh, 5000);
  }
}
document.addEventListener('visibilitychange', watch);
window.addEventListener('focus', refresh);
watch();
</script>
</body>
</html>
