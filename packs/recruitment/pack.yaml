domain_id: recruitment
name: Graduate recruitment screening
version: "1"
description: >-
  CV screening for a 1,000-hire campaign across four branches. This pack
  deliberately reproduces the scenario from the group's earlier client-side
  prototype (decision_partner_mvp / mvp+), so the two can be compared directly
  rather than rhetorically: same campaign, same branches, same essential
  requirements -- but the screening logic is an inspectable, governed rule base
  rather than a hard-coded function, and it is reviewed once instead of per CV.

  Recruitment is named in EU AI Act Annex III(4) as high-risk, which is what
  makes the criticality split below something other than a demo convenience.

source: synthetic, generated by packs/recruitment/generate.py
licence: n/a

entity_field: id
context_fields: [branch_role, seniority, sole_screener]

decision:
  goal_predicate: reject
  outcomes: [reject, advance]
  label_field: outcome
  label_map:
    reject: reject
    advance: advance

criticality:
  # A rejection at volume is the consequential act here: the applicant is never
  # told which requirement failed, and unlike a loan there is no later stage at
  # which the error surfaces. So senior roles and any screen with no second
  # reviewer are reviewed online, before the logic is allowed to bear on them.
  default_critical: false
  rules:
    - rule_id: senior_role
      description: >-
        senior and specialist roles are screened on logic reviewed in advance
      field: seniority
      op: in
      value: [senior, specialist]
    - rule_id: no_second_reviewer
      description: >-
        where no second human reviews the outcome, the rejection cannot be
        caught later, so the rule must be approved before it is used
      field: sole_screener
      op: eq
      value: true

predicates:
  # A domain predicate, true of every applicant. Datalog needs a positive
  # literal to bind the head variable: a body of only negated conditions
  # ("does not evidence X") ranges over nothing and is rejected as unsafe.
  # Naming the domain explicitly is the standard fix, and it also makes the
  # scope of each rule visible in its own text.
  - name: applicant
    arity: 1
    kind: observable
    phrase: "{0} is an applicant in this campaign"
    askable: false
  - name: meets_experience
    arity: 1
    kind: observable
    phrase: "{0} meets the stated experience requirement"
  - name: missing_experience_evidence
    arity: 1
    kind: observable
    phrase: "{0} has no clear evidence of relevant experience"
  - name: has_core_skill
    arity: 1
    kind: observable
    phrase: "{0} evidences the first essential skill"
  - name: has_second_skill
    arity: 1
    kind: observable
    phrase: "{0} evidences the second essential skill"
  - name: skill_evidence_absent
    arity: 1
    kind: observable
    phrase: "{0} supplied no evidence either way on an essential skill"
  - name: holds_credential
    arity: 1
    kind: observable
    phrase: "{0} holds the required credential"
  - name: timeline_conflict
    arity: 1
    kind: observable
    phrase: "{0} has a CV timeline that conflicts with a screening answer"
  - name: right_to_work
    arity: 1
    kind: observable
    phrase: "{0} evidences the right to work"
  - name: applied_in_window
    arity: 1
    kind: observable
    phrase: "{0} applied within the advertised window"
  # Carried for subgroup analysis only; NOT mapped to a feature, so it is
  # absent from the vocabulary the agent may write rules over.

  - name: requirements_unmet
    arity: 1
    kind: derived
    phrase: "{0} does not meet an essential requirement"
  - name: evidence_incomplete
    arity: 1
    kind: derived
    phrase: "{0} has incomplete screening evidence"
  - name: reject
    arity: 1
    kind: derived
    phrase: "{0} should be rejected at screening"
  - name: advance
    arity: 1
    kind: derived
    phrase: "{0} should advance to human shortlisting"

features:
  - {predicate: applicant,                  from: applicant,                  op: truthy, missing: false}
  - {predicate: meets_experience,           from: meets_experience,           op: truthy, missing: unknown}
  - {predicate: missing_experience_evidence,from: missing_experience_evidence,op: truthy, missing: false}
  - {predicate: has_core_skill,             from: has_core_skill,             op: truthy, missing: unknown}
  - {predicate: has_second_skill,           from: has_second_skill,           op: truthy, missing: unknown}
  - {predicate: skill_evidence_absent,      from: skill_evidence_absent,      op: truthy, missing: false}
  - {predicate: holds_credential,           from: holds_credential,           op: truthy, missing: unknown}
  - {predicate: timeline_conflict,          from: timeline_conflict,          op: truthy, missing: false}
  - {predicate: right_to_work,              from: right_to_work,              op: truthy, missing: unknown}
  - {predicate: applied_in_window,          from: applied_in_window,          op: truthy, missing: false}

documents:
  - screening_policy.md

seed_rules: []
