domain_id: benefits_eligibility
name: Hardship grant eligibility
description: >-
  A synthetic public-service eligibility domain. Cases are generated from a
  known rule set which is then withheld, so the agent's mined proposals can be
  scored against ground truth that no real dataset provides: precision and
  recall against the actual generating logic, not merely predictive accuracy.

  This is the pack that makes the mining claim checkable. On real data you can
  only ask whether a mined rule predicts well; here you can ask whether it is
  the right rule, which is the question a reviewer is actually being asked to
  answer when they approve one.

source: synthetic, generated by packs/benefits_eligibility/generate.py
licence: n/a

entity_field: id
context_fields: [award_amount, appeal_waived]

decision:
  goal_predicate: eligible
  outcomes: [eligible, refer_to_officer]
  label_field: outcome
  label_map:
    eligible: eligible
    not_eligible: refer_to_officer

criticality:
  # Routine small grants are reviewed offline; large awards, and any case where
  # the applicant has no route of appeal, are reviewed online before the logic
  # is allowed to bear on them.
  default_critical: false
  rules:
    - rule_id: large_award
      description: awards of 2000 or more are reviewed online
      field: award_amount
      op: gte
      value: 2000
    - rule_id: no_appeal_route
      description: >-
        where the applicant has waived or lost the right of appeal, the decision
        cannot be corrected later, so it is reviewed before it is made
      field: appeal_waived
      op: eq
      value: true

predicates:
  - name: low_income
    arity: 1
    kind: observable
    phrase: "{0} is below the income threshold"
    description: Household income below the published threshold.
  - name: has_dependants
    arity: 1
    kind: observable
    phrase: "{0} has dependants"
  - name: recent_award
    arity: 1
    kind: observable
    phrase: "{0} received an award in the last 12 months"
  - name: resident
    arity: 1
    kind: observable
    phrase: "{0} meets the residency condition"
  - name: savings_over_limit
    arity: 1
    kind: observable
    phrase: "{0} holds savings above the limit"
  - name: disability_premium
    arity: 1
    kind: observable
    phrase: "{0} receives a disability premium"
  - name: employed
    arity: 1
    kind: observable
    phrase: "{0} is in employment"
  - name: arrears
    arity: 1
    kind: observable
    phrase: "{0} is in rent arrears"
  # Deliberately irrelevant to the true rules. A miner that proposes rules over
  # these is finding noise, and the recovery evaluation will show it.
  - name: owns_bicycle
    arity: 1
    kind: observable
    phrase: "{0} owns a bicycle"
  - name: urban_postcode
    arity: 1
    kind: observable
    phrase: "{0} lives in an urban postcode"

  - name: eligible
    arity: 1
    kind: derived
    phrase: "{0} is eligible for a hardship grant"
  - name: refer_to_officer
    arity: 1
    kind: derived
    phrase: "{0} must be referred to an officer"

features:
  - predicate: low_income
    from: low_income
    op: truthy
    missing: unknown
  - predicate: has_dependants
    from: has_dependants
    op: truthy
    missing: unknown
  - predicate: recent_award
    from: recent_award
    op: truthy
    missing: unknown
  - predicate: resident
    from: resident
    op: truthy
    missing: unknown
  - predicate: savings_over_limit
    from: savings_over_limit
    op: truthy
    missing: unknown
  - predicate: disability_premium
    from: disability_premium
    op: truthy
    missing: unknown
  - predicate: employed
    from: employed
    op: truthy
    missing: unknown
  - predicate: arrears
    from: arrears
    op: truthy
    missing: unknown
  - predicate: owns_bicycle
    from: owns_bicycle
    op: truthy
    missing: unknown
  - predicate: urban_postcode
    from: urban_postcode
    op: truthy
    missing: unknown

documents:
  - hardship_policy.md

# No seed rules. The point of this pack is to start empty and watch the rule
# base get built from evidence and review.
seed_rules: []
